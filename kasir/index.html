<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0457b"><title>Kasir Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff7fa;--fg:#2b1a22;--mut:#8a6b78;--card:#fff;--line:#f1d3df;--pri:#e0457b;--ok:#2f9e63;--warn:#c9831b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0)}
@media(prefers-color-scheme:dark){:root{--bg:#1b1217;--fg:#fbeef3;--mut:#c49aab;--card:#2a1d24;--line:#43303a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 'Bricolage Grotesque',system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0))}
.w{max-width:520px;margin:0 auto;padding:14px 16px}
h1{font-size:22px;margin:4px 0 14px;font-weight:800}h2{font-size:15px;margin:18px 0 8px;font-weight:700}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
button{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:11px 16px;cursor:pointer}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}button.s{padding:7px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.chips button{flex:1}.chips .on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.step{display:flex;align-items:center;gap:14px;justify-content:space-between}.step b{font-size:28px;min-width:40px;text-align:center}.step button{width:52px;height:52px;font-size:24px;padding:0}
.rc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin:16px 0;position:relative}
.rc:before{content:"";position:absolute;left:12px;right:12px;bottom:60px;border-top:2px dashed var(--line)}
.rc .l{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;padding:2px 0}.rc .t{display:flex;justify-content:space-between;align-items:baseline;margin-top:30px}.rc .t b{font-size:32px;font-weight:800}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.kb div{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px}.kb b{display:block;font-size:19px}.kb span{font-size:12px;color:var(--mut)}
.od{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.od .h{display:flex;justify-content:space-between;gap:8px;cursor:pointer}.od .c{font-weight:800}.od .m{font-size:13px;color:var(--mut)}
.tg{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff}.tg.lunas{background:var(--ok)}.tg.belum{background:var(--warn)}
.ac{display:none;gap:6px;flex-wrap:wrap;margin-top:10px}.od.open .ac{display:flex}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;color:var(--mut)}nav .on{color:var(--pri)}
.mod{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px;z-index:9}.mod.show{display:grid}
.mod .b{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:400px;text-align:center}.mod .code{font-size:34px;font-weight:800;color:var(--pri);margin:6px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;display:none;z-index:10;font-size:14px}
.pg{display:none}.pg.show{display:block}#rcp{display:none}
@media print{@page{margin:0;size:58mm auto}body>*:not(#rcp){display:none!important}#rcp{display:block;width:58mm;padding:4mm;font:12px/1.3 monospace;color:#000;background:#fff}#rcp hr{border:0;border-top:1px dashed #000}#rcp div{display:flex;justify-content:space-between}}
</style></head><body>
<div id="lg" class="w"><h1>Kasir Photobooth</h1>
<label>Supabase URL</label><input id="su" placeholder="https://xxxx.supabase.co" autocapitalize="none">
<label>Supabase anon key</label><input id="sk" type="password" autocapitalize="none">
<label>Email staf</label><input id="le" type="email" autocapitalize="none">
<label>Kata sandi</label><input id="lp" type="password"><br><br><button class="p" id="lb" style="width:100%">Masuk</button></div>

<div id="ap" style="display:none">
<div class="pg show w" id="p0"><h1 id="ush">Kasir</h1>
<label>Nama pelanggan</label><input id="nm" autocomplete="off" autocapitalize="words">
<div class="row"><div><label>WhatsApp</label><input id="wa" inputmode="tel" placeholder="08xxxxxxxxxx"></div><div><label>Email (opsional)</label><input id="em" type="email" autocapitalize="none"></div></div>
<label>Jumlah cetak</label><div class="step"><button id="mn">−</button><b id="pc">1</b><button id="pl">+</button></div>
<label>Metode bayar</label><div class="row chips" id="mt"><button data-m="tunai" class="on">Tunai</button><button data-m="qris">QRIS</button><button data-m="transfer">Transfer</button></div>
<div id="cash"><label>Uang diterima</label><input id="by" type="number" inputmode="numeric"></div>
<div class="rc"><div class="l"><span id="l1"></span><span id="v1"></span></div><div class="l"><span>Biaya sesi</span><span id="v2"></span></div><div class="l"><span id="l3">Kembalian</span><span id="v3">Rp0</span></div><div class="t"><span>Total</span><b id="tt">Rp0</b></div></div>
<div class="row"><button id="bl">Simpan belum bayar</button><button class="p" id="ls">Terima & simpan</button></div></div>

<div class="pg w" id="p1"><h1>Pesanan</h1><div class="kb"><div><b id="k1">0</b><span>Omzet hari ini</span></div><div><b id="k2">0</b><span>Pesanan</span></div><div><b id="k3">0</b><span>Total cetak</span></div></div>
<input id="q" placeholder="Cari nama atau kode order" autocapitalize="none"><h2 id="lh">Hari ini</h2><div id="ol"></div></div>

<div class="pg w" id="p2"><h1>Pengaturan</h1>
<label>Nama usaha / booth</label><input id="s_usaha"><div class="row"><div><label>Biaya sesi (Rp)</label><input id="s_fee" type="number" inputmode="numeric"></div><div><label>Harga per cetak (Rp)</label><input id="s_unit" type="number" inputmode="numeric"></div></div>
<label>URL halaman viewer (sama dengan kiosk)</label><input id="s_base" autocapitalize="none">
<label>Pola link unduh file, pakai {id}</label><input id="s_dl" placeholder="https://files.domainmu.com/photobooth/{id}/print.png" autocapitalize="none">
<label>Pesan WA / email. Pakai {nama} {kode} {link} {usaha}</label><textarea id="s_msg" rows="5"></textarea><br><br>
<button class="p" id="ss" style="width:100%">Simpan pengaturan</button><br><br><button id="lo" style="width:100%">Keluar</button></div>

<nav><button data-p="0" class="on">Kasir</button><button data-p="1">Pesanan</button><button data-p="2">Atur</button></nav></div>

<div class="mod" id="dn"><div class="b"><div>Pesanan tersimpan</div><div class="code" id="dc"></div><div class="row"><button id="dp">Cetak struk</button><button id="dw" class="p">Kirim WA</button></div><br><button id="dx" style="width:100%">Pesanan baru</button><p style="font-size:13px;color:var(--mut);margin:12px 0 0">Isi kode ini di kolom nama pada kiosk. QR di cetakan akan membuka video AR BTS.</p></div></div>
<div id="rcp"></div><div id="toast"></div>

<script>
const $=s=>$$(s)[0],$$=s=>document.querySelectorAll(s),rp=n=>'Rp'+(+n||0).toLocaleString('id-ID'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let C={};try{C=JSON.parse(localStorage.pbc||'{}')}catch(e){}
let sb,pr=1,mth='tunai',LAST,S={usaha:'Photobooth',fee:'0',unit:'10000',base:'',dl:'',msg:'Halo {nama}! Foto dari {usaha} (kode {kode}) sudah siap:\n{link}\nTerima kasih sudah berfoto 💖'};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',2600)};
const tot=()=>(+S.fee||0)+pr*(+S.unit||0);
function calc(){const t=tot(),by=+$('#by').value||0;$('#pc').textContent=pr;$('#l1').textContent=pr+' cetak × '+rp(S.unit);$('#v1').textContent=rp(pr*S.unit);$('#v2').textContent=rp(S.fee);$('#tt').textContent=rp(t);
 $('#cash').style.display=mth=='tunai'?'':'none';const k=by-t;$('#l3').textContent=k<0&&mth=='tunai'?'Kurang':'Kembalian';$('#v3').textContent=mth=='tunai'?rp(Math.abs(k)):'-'}
$('#mn').onclick=()=>{pr=Math.max(1,pr-1);calc()};$('#pl').onclick=()=>{pr=Math.min(50,pr+1);calc()};$('#by').oninput=calc;
$$('#mt button').forEach(b=>b.onclick=()=>{mth=b.dataset.m;$$('#mt button').forEach(x=>x.classList.toggle('on',x==b));calc()});
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.toggle('on',x==b));$$('.pg').forEach((p,i)=>p.classList.toggle('show',i==b.dataset.p));if(b.dataset.p==1)load()});

async function enter(){const {data}=await sb.from('settings').select('*');(data||[]).forEach(r=>S[r.key]=r.value);
 ['usaha','fee','unit','base','dl','msg'].forEach(k=>$('#s_'+k).value=S[k]);$('#ush').textContent=S.usaha;$('#lg').style.display='none';$('#ap').style.display='block';calc()}
function mk(){if(!C.url||!C.key)return false;sb=supabase.createClient(C.url,C.key);return true}
$('#lb').onclick=async()=>{C={url:$('#su').value.trim(),key:$('#sk').value.trim()};if(!mk())return toast('Isi URL dan anon key');
 const {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});if(error)return toast('Gagal masuk: '+error.message);localStorage.pbc=JSON.stringify(C);enter()};
$('#lo').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#ss').onclick=async()=>{const rows=['usaha','fee','unit','base','dl','msg'].map(k=>({key:k,value:$('#s_'+k).value.trim()}));const {error}=await sb.from('settings').upsert(rows);if(error)return toast(error.message);rows.forEach(r=>S[r.key]=r.value);$('#ush').textContent=S.usaha;calc();toast('Pengaturan disimpan')};

async function save(lunas){const nama=$('#nm').value.trim();if(!nama)return toast('Isi nama pelanggan');const t=tot();
 if(lunas&&mth=='tunai'&&(+$('#by').value||0)<t)return toast('Uang diterima kurang');
 const d=new Date(),pre='PB-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-';let o,err;
 for(let k=0;k<4&&!o;k++){const {count}=await sb.from('orders').select('*',{count:'exact',head:true}).like('code',pre+'%');
  const r=await sb.from('orders').insert({code:pre+String((count||0)+1+k).padStart(3,'0'),nama,wa:$('#wa').value.trim(),email:$('#em').value.trim(),prints:pr,unit_price:+S.unit||0,session_fee:+S.fee||0,total:t,method:mth,paid:lunas?t:0,status:lunas?'lunas':'belum'}).select().single();
  if(r.error&&r.error.code!='23505'){err=r.error;break}o=r.data}
 if(!o)return toast(err?err.message:'Gagal membuat kode order');LAST=o;$('#dc').textContent=o.code;$('#dn').classList.add('show')}
$('#ls').onclick=()=>save(true);$('#bl').onclick=()=>save(false);
$('#dx').onclick=()=>{$('#dn').classList.remove('show');['nm','wa','em','by'].forEach(i=>$('#'+i).value='');pr=1;calc()};
$('#dp').onclick=()=>receipt(LAST);$('#dw').onclick=()=>sendTo(LAST,'wa');

function receipt(o){const by=+$('#by').value||0;$('#rcp').innerHTML=`<div style="justify-content:center"><b>${esc(S.usaha)}</b></div><div style="justify-content:center">${new Date(o.created_at).toLocaleString('id-ID')}</div><hr><div><span>Kode</span><b>${esc(o.code)}</b></div><div><span>Nama</span><span>${esc(o.nama)}</span></div><hr><div><span>${o.prints} cetak × ${rp(o.unit_price)}</span><span>${rp(o.prints*o.unit_price)}</span></div>${o.session_fee?`<div><span>Biaya sesi</span><span>${rp(o.session_fee)}</span></div>`:''}<div><b>TOTAL</b><b>${rp(o.total)}</b></div><div><span>Bayar (${o.method})</span><span>${o.status=='lunas'?'LUNAS':'BELUM'}</span></div><hr><div style="justify-content:center">Terima kasih 💖</div>`;setTimeout(()=>window.print(),80)}

async function load(){const q=$('#q').value.trim().replace(/[%,()]/g,''),s=new Date();s.setHours(0,0,0,0);
 const {data:td}=await sb.from('orders').select('*').gte('created_at',s.toISOString()).order('created_at',{ascending:false});
 const L=td||[];$('#k1').textContent=rp(L.filter(o=>o.status=='lunas').reduce((a,o)=>a+o.total,0));$('#k2').textContent=L.length;$('#k3').textContent=L.reduce((a,o)=>a+o.prints,0);
 let R=L;$('#lh').textContent='Hari ini';if(q){const r=await sb.from('orders').select('*').or(`nama.ilike.%${q}%,code.ilike.%${q}%`).order('created_at',{ascending:false}).limit(50);R=r.data||[];$('#lh').textContent='Hasil pencarian'}
 $('#ol').innerHTML=R.length?R.map(o=>`<div class="od" data-i="${o.id}"><div class="h"><div><div class="c">${esc(o.code)}</div><div>${esc(o.nama)}</div><div class="m">${o.prints} cetak · ${esc(o.method)} · ${rp(o.total)}${o.sent_at?' · file terkirim':''}${o.printed?' · tercetak':''}</div></div><span class="tg ${o.status}">${o.status}</span></div>
 <div class="ac"><button class="s" data-a="wa">Kirim WA</button><button class="s" data-a="em">Kirim email</button><button class="s" data-a="pr">${o.printed?'Batal tercetak':'Tandai tercetak'}</button><button class="s" data-a="rc">Struk</button>${o.status=='belum'?'<button class="s p" data-a="ln">Lunasi</button>':''}</div></div>`).join(''):'<p class="m" style="color:var(--mut)">Belum ada pesanan.</p>';
 $$('#ol .od').forEach(e=>{const o=R.find(x=>x.id==e.dataset.i);e.querySelector('.h').onclick=()=>e.classList.toggle('open');
  e.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const a=b.dataset.a;if(a=='wa'||a=='em')return sendTo(o,a);if(a=='rc')return receipt(o);
   const u=a=='pr'?{printed:!o.printed}:{status:'lunas',paid:o.total};const {error}=await sb.from('orders').update(u).eq('id',o.id);error?toast(error.message):load()})})}
$('#q').oninput=()=>{clearTimeout($('#q').t);$('#q').t=setTimeout(load,350)};

async function sendTo(o,via){if(via=='wa'&&!o.wa)return toast('Nomor WA belum diisi');if(via=='em'&&!o.email)return toast('Email belum diisi');
 const {data}=await sb.from('pb_sessions').select('id').ilike('order_code',o.code).order('created_at',{ascending:false}).limit(1);const id=data&&data[0]&&data[0].id;
 if(!id)return toast('Foto belum masuk dari kiosk');
 const link=[S.base&&S.base+(S.base.includes('?')?'&':'?')+'id='+id,S.dl&&S.dl.replace('{id}',id)].filter(Boolean).join('\n');
 const m=S.msg.replace(/\{nama\}/g,o.nama).replace(/\{kode\}/g,o.code).replace(/\{usaha\}/g,S.usaha).replace('{link}',link);
 if(via=='wa'){let n=o.wa.replace(/\D/g,'');if(n[0]=='0')n='62'+n.slice(1);window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank')}
 else location.href='mailto:'+o.email+'?subject='+encodeURIComponent('Foto kamu dari '+S.usaha)+'&body='+encodeURIComponent(m);
 await sb.from('orders').update({sent_at:new Date().toISOString()}).eq('id',o.id)}

$('#su').value=C.url||'';$('#sk').value=C.key||'';
if(mk())sb.auth.getSession().then(({data})=>data.session&&enter());
</script></body></html>
