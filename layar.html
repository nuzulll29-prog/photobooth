<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Layar Photobooth</title>
<style>
:root{--bg:#1b1217;--fg:#fbeef3;--mut:#c49aab;--pri:#e0457b;--pri2:#ff8fb1;--line:#43303a}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:18px/1.4 system-ui,sans-serif}
.s{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
body[data-s=wait] #wait,body[data-s=idle] #idle,body[data-s=cam] #cam,body[data-s=rev] #rev,body[data-s=res] #res{display:flex}
h1{font-size:clamp(32px,6vw,72px);margin:0}.mut{color:var(--mut)}
#code{font-size:clamp(48px,12vw,140px);font-weight:800;letter-spacing:.12em;color:var(--pri2)}
input,button{font:inherit;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:#2a1d24;color:var(--fg)}
button{cursor:pointer}button.p{background:var(--pri);border-color:var(--pri);font-weight:700}
#cfg{display:none;flex-direction:column;gap:10px;width:min(440px,100%)}
#cam{background:#000;padding:0;gap:0}
#box{position:relative;overflow:hidden;background:#000}
#v{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
#g{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:4px dashed #fffe;box-shadow:0 0 0 9999px #0007;border-radius:12px}
#cd{position:absolute;inset:0;display:grid;place-items:center;font-size:min(36vw,40vh);font-weight:800;text-shadow:0 6px 30px #000a;pointer-events:none}
#fl{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .3s;pointer-events:none}
#top{position:fixed;top:16px;left:0;right:0;z-index:3;font-size:clamp(22px,3vw,40px);font-weight:700;text-shadow:0 2px 14px #000;pointer-events:none}
#th{position:fixed;bottom:16px;left:0;right:0;z-index:3;display:flex;gap:10px;justify-content:center;align-items:flex-end}
#th img{height:clamp(60px,12vh,130px);border-radius:10px;border:3px solid #fff}
#dots{display:flex;gap:10px;justify-content:center;margin-bottom:8px}#dots i{width:16px;height:16px;border-radius:50%;background:#fff5}#dots i.ok{background:var(--pri2)}#dots i.cur{background:var(--pri);transform:scale(1.4)}
#rg{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-height:78vh;overflow:hidden}#rg img{height:30vh;border-radius:14px;border:4px solid #fff}
#ri{max-height:84vh;max-width:92vw;border-radius:14px;box-shadow:0 10px 50px #0008}
#fs{position:fixed;right:12px;top:12px;z-index:9;padding:8px 12px;opacity:.5}
</style></head>
<body data-s="wait">
<button id="fs">⛶</button>
<div class="s" id="wait"><h1>📸 Layar Photobooth</h1>
 <div id="cfg"><p class="mut">Isi sekali saja di laptop ini.</p><input id="api" placeholder="URL Worker (https://...workers.dev)" autocapitalize="none"><input id="key" type="password" placeholder="Kunci kiosk"><button class="p" id="sv">Simpan</button></div>
 <div id="pair"><div class="mut">Kode layar</div><div id="code"></div><div class="mut" id="st">Masukkan kode ini di pengaturan staf kiosk (HP), kolom <b>Kode layar penampil</b>.</div><br><button id="nc">Ganti kode</button></div></div>
<div class="s" id="idle"><h1>📸 Photobooth</h1><div class="mut" id="im">Ayo berfoto!</div></div>
<div class="s" id="cam"><div id="top"></div><div id="box"><video id="v" playsinline autoplay muted></video><div id="g"></div><div id="cd"></div><div id="fl"></div></div><div id="th"></div></div>
<div class="s" id="rev"><h1>Suka hasilnya?</h1><div id="rg"></div></div>
<div class="s" id="res"><h1 id="rt">Menyiapkan hasil…</h1><img id="ri" alt="" style="display:none"><div class="mut" id="rn" style="display:none">Scan QR di foto untuk melihat video BTS ✨</div></div>
<script>
const $=s=>document.querySelector(s),show=s=>document.body.dataset.s=s;
let C={};try{C=JSON.parse(localStorage.lyd||'{}')}catch(e){}
if(!C.room)C.room=String(Math.floor(10000+Math.random()*90000));
const sv=()=>localStorage.lyd=JSON.stringify(C);sv();
const room=C.room,hid=()=>Math.random().toString(36).slice(2,8);
let pc=null,sid='',after=0,my=hid(),q=Promise.resolve(),shots=[],ar=1.4,camr=4/3,nn=3,cur=-1,k=0,buf={},t;
$('#code').textContent=room;
$('#nc').onclick=()=>{C.room=String(Math.floor(10000+Math.random()*90000));sv();location.reload()};
$('#fs').onclick=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
const H=()=>({'X-Kiosk-Key':C.key,'Content-Type':'application/json'});
const stt=t=>$('#st').textContent=t;let seen=0;
const chk=j=>{if(j&&j.error==='not found'){stt('Worker belum diperbarui: alamat layar tidak ditemukan. Ganti kode worker.js di Cloudflare lalu Deploy.');return 1}if(j&&j.error==='unauthorized'){stt('Kunci kiosk salah.');return 1}};
const post=m=>q=q.then(()=>fetch(C.api.replace(/\/$/,'')+'/photobooth/sig',{method:'POST',headers:H(),body:JSON.stringify({room,from:'b',msg:m})}).then(r=>r.json()).then(chk)).catch(()=>stt('Tidak ada koneksi ke server…'));
function boxFit(){const b=$('#box');b.style.aspectRatio=camr;b.style.width=`min(100vw,${(100*camr).toFixed(2)}vh)`;const g=$('#g');
 if(ar>=camr){g.style.width='100%';g.style.height=(camr/ar*100)+'%'}else{g.style.height='100%';g.style.width=(ar/camr*100)+'%'}}
function dotsDraw(){const w=document.createElement('div');w.id='dots';for(let j=0;j<nn;j++){const i=document.createElement('i');if(shots[j])i.className='ok';if(j==cur)i.className+=' cur';w.appendChild(i)}
 $('#th').innerHTML='';$('#th').appendChild(w);const r=document.createElement('div');r.style.cssText='display:flex;gap:10px;position:absolute;bottom:34px';
 shots.forEach(u=>{if(u){const im=new Image();im.src=u;r.appendChild(im)}});$('#th').appendChild(r)}
function handle(o){
 if(o.t=='scr'){const n=o.n;if(n==0){shots=[];cur=-1;$('#ri').style.display='none';$('#rn').style.display='none';$('#rt').textContent='Menyiapkan hasil…'}
  if(n==3)show('cam');else if(n==4){$('#rg').innerHTML='';shots.forEach(u=>{if(u){const i=new Image();i.src=u;$('#rg').appendChild(i)}});show('rev')}
  else if(n==5)show('res');else{$('#im').textContent={1:'Memilih layout…',2:'Memilih tema…',6:'Mengisi kode order…'}[n]||'Ayo berfoto!';show('idle')}}
 else if(o.t=='shoot'){ar=o.ar||1.4;camr=o.camr||4/3;nn=o.n||3;$('#top').textContent=o.pose||'';$('#cd').textContent='';boxFit();dotsDraw();show('cam')}
 else if(o.t=='cd')$('#cd').textContent=o.n;
 else if(o.t=='fl'){$('#cd').textContent='';$('#fl').style.opacity=1;setTimeout(()=>$('#fl').style.opacity=0,150)}
 else if(o.t=='dots'){nn=o.n;cur=o.cur;$('#top').textContent=cur>=0?`Foto ${cur+1} dari ${nn}`:$('#top').textContent;dotsDraw()}
 else if(o.t=='shot'){shots[o.i]=o.img;dotsDraw()}
 else if(o.t=='result'){$('#ri').src=o.img;$('#ri').style.display='';$('#rn').style.display='';$('#rt').textContent='Foto kamu sudah jadi! 🎉';show('res')}}
function rx(d){const o=JSON.parse(d);if(o.t!='chunk')return handle(o);const b=buf[o.id]=buf[o.id]||[];b[o.i]=o.d;if(b.filter(Boolean).length==o.n){delete buf[o.id];handle(JSON.parse(b.join('')))}}
async function onMsg(m){
 if(m.offer){try{pc&&pc.close()}catch(e){}sid=m.sid;const p=pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  p.ontrack=e=>{$('#v').srcObject=e.streams[0]||new MediaStream([e.track]);$('#v').play().catch(()=>{})};
  p.ondatachannel=e=>{e.channel.onmessage=ev=>rx(ev.data)};
  p.onicecandidate=e=>e.candidate&&post({sid:m.sid,c:e.candidate});
  p.onconnectionstatechange=()=>{if(p!==pc)return;const s=p.connectionState;
   if(s=='connected'){show('idle');$('#im').textContent='Ayo berfoto!'}
   else if(s=='failed'||s=='disconnected'||s=='closed'){show('wait');$('#st').textContent='Kamera terputus. Menghubungkan ulang…';setTimeout(()=>{my=hid();post({hello:my})},3000)}};
  await p.setRemoteDescription(m.offer);await p.setLocalDescription(await p.createAnswer());post({sid:m.sid,answer:p.localDescription})}
 else if(m.c&&m.sid===sid&&pc)await pc.addIceCandidate(m.c).catch(()=>{})}
function start(){$('#cfg').style.display='none';$('#pair').style.display='';post({hello:my});
 t=setInterval(async()=>{if(pc&&pc.connectionState=='connected'&&++k%6)return;
  try{const r=await fetch(`${C.api.replace(/\/$/,'')}/photobooth/sig?room=${room}&for=b&after=${after}`,{headers:{'X-Kiosk-Key':C.key}}),j=await r.json();if(chk(j))return;
   for(const x of j.msgs||[]){after=Math.max(after,x.i);seen++;await onMsg(x.m)}
   if(!pc||pc.connectionState!=='connected')stt(`Server terhubung ✓. Menunggu HP memakai kode ini… (pesan dari HP: ${seen}${pc?', sambungan: '+pc.connectionState+'/'+pc.iceConnectionState:''})`)}catch(e){stt('Tidak ada koneksi ke server…')}},900)}
if(C.api&&C.key)start();else{$('#cfg').style.display='flex';$('#pair').style.display='none'}
$('#sv').onclick=()=>{C.api=$('#api').value.trim();C.key=$('#key').value.trim();if(!C.api||!C.key)return;sv();start()};
</script></body></html>
